<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a001a">
<title>🎵 WINORO MUSIC</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
/* =========================================================
   🎨 VARIABEL WARNA & LATAR
   ========================================================= */
:root{
    --gambar-latar: url('');
    --neon1:#ff00c8; --neon2:#00fff2; --neon3:#b700ff;
    --bg1:#050010; --bg2:#150030; --text:#ffffff;
    --atas: env(safe-area-inset-top, 12px);
    --bawah: env(safe-area-inset-bottom, 16px);
    --kiri: env(safe-area-inset-left, 12px);
    --kanan: env(safe-area-inset-right, 12px);
}

/* 🎨 SETIAP TEMA */
body.tema-pelangi{ --gambar-latar: url(''); --neon1:#ff00c8; --neon2:#00fff2; --neon3:#b700ff; --bg1:#050010; --bg2:#150030; }
body.tema-ungu{ --gambar-latar: url(''); --neon1:#c300ff; --neon2:#7a00ff; --neon3:#ff00aa; --bg1:#0f0020; --bg2:#1e0040; }
body.tema-biru{ --gambar-latar: url(''); --neon1:#00e5ff; --neon2:#0080ff; --neon3:#00ffd5; --bg1:#000814; --bg2:#001530; }
body.tema-merah{ --gambar-latar: url(''); --neon1:#ff0055; --neon2:#ff8800; --neon3:#ffff00; --bg1:#140005; --bg2:#2a0010; }
body.tema-hijau{ --gambar-latar: url(''); --neon1:#00ff88; --neon2:#88ff00; --neon3:#00ffcc; --bg1:#001408; --bg2:#002a10; }
body.tema-emas{ --gambar-latar: url(''); --neon1:#ffd700; --neon2:#ff8c00; --neon3:#fff200; --bg1:#140d00; --bg2:#2a1a00; }

*{
    margin:0; padding:0; box-sizing:border-box;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    touch-action: manipulation;
    user-select: none;
    transition: all 0.25s ease;
}

html, body{
    width: 100%;
    min-height: 100dvh;
    height: 100dvh;
    overflow: hidden;
}

body{
    background-image:
        linear-gradient(160deg, rgba(0,0,0,0.6), rgba(0,0,0,0.78)),
        var(--gambar-latar),
        radial-gradient(ellipse at top, var(--bg2), var(--bg1) 80%);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    display: flex;
    flex-direction: column;
    padding: var(--atas) var(--kanan) var(--bawah) var(--kiri);
}

/* =========================================================
   🎯 HEADER & JUDUL
   ========================================================= */
.header{
    position: fixed;
    top: var(--atas);
    left: var(--kiri);
    right: var(--kanan);
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 990;
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(10px);
    border-radius: 14px;
    margin: 8px 0;
}

.judul-aplikasi{
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: clamp(20px, 5vw, 26px);
    font-weight: 900;
    letter-spacing: 1px;
    text-shadow: 0 0 6px var(--neon1), 0 0 12px var(--neon2);
    animation: nyala 2s ease-in-out infinite alternate;
}

.judul-aplikasi .icon{
    font-size: 1.2em;
    filter: drop-shadow(0 0 8px var(--neon3));
    animation: goyang 1.5s ease-in-out infinite;
}

@keyframes nyala { from { filter: brightness(0.9); } to { filter: brightness(1.4); } }
@keyframes goyang { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }

/* =========================================================
   📱 TOMBOL & LACI
   ========================================================= */
.tombol-menu{
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid var(--neon2);
    box-shadow: 0 0 10px var(--neon1);
    display: grid;
    place-items: center;
    font-size: 20px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    z-index: 10;
    pointer-events: auto;
}
.tombol-menu:active{ transform: scale(0.9); box-shadow: 0 0 15px var(--neon2); }

.tombol-tema{
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid var(--neon1);
    box-shadow: 0 0 10px var(--neon2);
    display: grid;
    place-items: center;
    font-size: 20px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    z-index: 10;
    pointer-events: auto;
}
.tombol-tema:active{ transform: scale(0.9); }

.tombol-tutup{
    position: absolute;
    top: 15px;
    right: 15px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1.5px solid var(--neon1);
    box-shadow: 0 0 8px var(--neon1);
    display: grid;
    place-items: center;
    font-size: 18px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: 0.2s;
    pointer-events: auto;
}
.tombol-tutup:hover{
    background: rgba(255,0,200,0.2);
    transform: scale(1.05);
}
.tombol-tutup:active{
    transform: scale(0.9);
}

.laci{
    position: fixed;
    top: 0;
    right: 0;
    height: 100dvh;
    width: min(95vw, 550px);
    background: linear-gradient(180deg, rgba(15,0,35,0.96), rgba(0,0,0,0.94));
    border-left: 2px solid var(--neon1);
    box-shadow: -12px 0 40px rgba(255,0,200,0.28);
    backdrop-filter: blur(16px);
    transform: translateX(110%);
    transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    padding: calc(25px + var(--atas)) 20px;
    overflow-y: auto;
    z-index: 1000;
    pointer-events: auto;
}
.laci.buka{ transform: translateX(0); }

.tutup-latar{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s;
}
.tutup-latar.buka{ opacity: 1; pointer-events: auto; }

.judul-bagian{
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 15px;
    text-shadow: 0 0 8px var(--neon1);
    display: flex;
    align-items: center;
    gap: 8px;
}
.garis-pemisah{
    height: 2px;
    background: linear-gradient(90deg, var(--neon1), var(--neon2), transparent);
    margin: 12px 0 20px;
    border-radius: 2px;
}

.tombol-bagian{
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 12px;
    border-radius: 12px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    text-align: left;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: 0.2s;
    pointer-events: auto;
}
.tombol-bagian:hover, .tombol-bagian.aktif{
    background: rgba(255,0,200,0.15);
    border-color: var(--neon1);
    box-shadow: 0 0 10px rgba(255,0,200,0.2);
}
.tombol-bagian .panah{
    font-size: 18px;
    transition: transform 0.3s;
}
.tombol-bagian.aktif .panah{ transform: rotate(90deg); }

.konten-bagian{
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease;
    margin-bottom: 15px;
}
.konten-bagian.buka{ max-height: 80vh; }

.daftar-lagu-wrapper{
    max-height: 60vh;
    overflow-y: auto;
    border-radius: 12px;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 8px;
}
.daftar-lagu-wrapper::-webkit-scrollbar{
    width: 6px;
}
.daftar-lagu-wrapper::-webkit-scrollbar-track{
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
}
.daftar-lagu-wrapper::-webkit-scrollbar-thumb{
    background: linear-gradient(var(--neon1), var(--neon2));
    border-radius: 10px;
}

.daftar-lagu-item{
    display: flex;
    align-items: center;
    padding: 12px 14px;
    margin: 6px 0;
    border-radius: 10px;
    background: rgba(255,255,255,0.05);
    border-left: 3px solid transparent;
    cursor: pointer;
    transition: 0.2s;
    gap: 12px;
    pointer-events: auto;
}
.daftar-lagu-item:hover, .daftar-lagu-item.aktif{
    background: rgba(255,0,200,0.18);
    border-left-color: var(--neon2);
    box-shadow: 0 0 8px rgba(0,255,242,0.2);
}
.nomor-lagu{
    min-width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--neon1), var(--neon2));
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 14px;
    color: #000;
    box-shadow: 0 0 6px var(--neon1);
}
.nama-lagu{
    flex: 1;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.pengaturan-blok{
    padding: 16px;
    border-radius: 12px;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.08);
}
.judul-pengaturan{
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.slider-booster{
    width: 100%;
    height: 8px;
    border-radius: 99px;
    background: rgba(255,255,255,0.15);
    outline: none;
    -webkit-appearance: none;
    margin: 10px 0;
    pointer-events: auto;
}
.slider-booster::-webkit-slider-thumb{
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--neon1), var(--neon2));
    box-shadow: 0 0 12px var(--neon1);
    cursor: pointer;
}
.nilai-booster{
    text-align: right;
    font-size: 14px;
    font-weight: 500;
    color: var(--neon2);
}
.pilih-folder{
    display: block;
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border-radius: 12px;
    border: 1.5px dashed var(--neon2);
    background: rgba(0,0,0,0.25);
    text-align: center;
    cursor: pointer;
    font-weight: 500;
    font-size: 15px;
    pointer-events: auto;
}
.pilih-folder:active{
    background: linear-gradient(135deg, var(--neon1), var(--neon2));
    color: #000;
    border-style: solid;
}

/* =========================================================
   🎵 BAGIAN PEMUTAR
   ========================================================= */
.isi-tengah{
    margin-top: 80px;
    flex: 1;
    overflow-y: auto;
    padding: 15px 5% 25px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}
.isi-tengah::-webkit-scrollbar{ display: none; }

.pemutar{
    width: 100%;
    max-width: 450px;
    margin: 10px auto;
    padding: clamp(18px, 5vw, 25px);
    border-radius: 24px;
    background: linear-gradient(145deg, rgba(255,255,255,0.07), rgba(0,0,0,0.45));
    border: 1.5px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    position: relative;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    pointer-events: auto;
    z-index: 5;
}
.pemutar::before{
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 26px;
    padding: 2px;
    background: linear-gradient(135deg, var(--neon1), var(--neon2), var(--neon3), var(--neon1));
    background-size: 300% 300%;
    animation: putarWarna 7s linear infinite;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
}
@keyframes putarWarna { to { background-position: 300% 50%; } }

.wadah-gambar{
    width: min(45vw, 190px);
    aspect-ratio: 1/1;
    margin: 10px auto 18px;
    position: relative;
    cursor: pointer;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 15px var(--neon1), 0 0 30px var(--neon2);
    transition: transform 0.3s;
    pointer-events: auto;
}
.wadah-gambar:active{ transform: scale(0.96); }

.gambar-lagu{
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: radial-gradient(circle, #222 0%, #111 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(30px, 8vw, 40px);
    color: var(--neon3);
}
.gambar-lagu.putar{ animation: putar 8s linear infinite; }
@keyframes putar { to { transform: rotate(360deg); } }

#input-gambar{ display: none; }

.info-lagu{
    text-align: center;
    margin-bottom: 12px;
}
.teks-sedang{
    font-size: 12px;
    opacity: 0.7;
    letter-spacing: 1px;
    margin-bottom: 6px;
}
#judul-lagu{
    font-size: clamp(14px, 4vw, 17px);
    font-weight: 700;
    text-shadow: 0 0 6px var(--neon1);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 8px;
}

canvas{
    width: 100%;
    height: clamp(55px, 12vw, 75px);
    margin: 12px 0;
    border-radius: 14px;
    background: rgba(0,0,0,0.25);
    pointer-events: none;
}

.batas-waktu{
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.15);
    border-radius: 99px;
    cursor: pointer;
    overflow: hidden;
    margin: 12px 0;
    position: relative;
    pointer-events: auto;
}
.isi-waktu{
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--neon1), var(--neon2));
    box-shadow: 0 0 10px var(--neon1);
    border-radius: 99px;
    transition: width 0.1s linear;
}
.waktu-tampil{
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    opacity: 0.9;
    margin-bottom: 16px;
    font-weight: 500;
}

.tombol-kontrol{
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(10px, 3vw, 18px);
    margin: 12px 0;
    pointer-events: auto;
    position: relative;
    z-index: 10;
}
.tombol-kontrol button{
    width: clamp(42px, 12vw, 52px);
    height: clamp(42px, 12vw, 52px);
    border-radius: 50%;
    border: 1.5px solid var(--neon2);
    background: rgba(255,255,255,0.06);
    box-shadow: 0 0 8px var(--neon1);
    font-size: clamp(16px, 4.5vw, 20px);
    cursor: pointer;
    display: grid;
    place-items: center;
    pointer-events: auto;
    transition: all 0.2s;
}
.tombol-kontrol button:active{ transform: scale(0.9); }
.tombol-kontrol .utama{
    width: clamp(58px, 16vw, 70px);
    height: clamp(58px, 16vw, 70px);
    font-size: clamp(22px, 6vw, 28px);
    background: linear-gradient(135deg, var(--neon1), var(--neon2));
    border-color: #fff;
    box-shadow: 0 0 15px var(--neon1);
}
.tombol-kontrol .aktif{
    background: rgba(255,0,200,0.3);
    border-color: var(--neon1);
    box-shadow: 0 0 12px var(--neon1);
}

.pilihan-tema{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
}
.kartu-tema{
    padding: 10px;
    border-radius: 12px;
    border: 1.5px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 13px;
    pointer-events: auto;
}
.kartu-tema.aktif{
    border-color: var(--neon2);
    box-shadow: 0 0 12px var(--neon1);
    background: rgba(255,0,200,0.15);
}
.bulet-tema{
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--neon1), var(--neon2));
    box-shadow: 0 0 8px var(--neon1);
}
</style>
</head>
<body class="tema-pelangi">

<!-- HEADER -->
<div class="header">
    <div class="judul-aplikasi">
        <span class="icon">🎵</span>
        WINORO MUSIC
    </div>
    <div style="display: flex; gap: 10px;">
        <div class="tombol-tema" id="bukaTema">🎨</div>
        <div class="tombol-menu" id="bukaMenu">☰</div>
    </div>
</div>

<!-- LATAR PENUTUP LACI -->
<div class="tutup-latar" id="tutupLatar"></div>

<!-- ✅ LACI UTAMA: DAFTAR ISI -->
<div class="laci" id="laciUtama">
    <div class="tombol-tutup" id="tutupMenu">✕</div>
    <h3 class="judul-bagian">📑 DAFTAR ISI</h3>
    <div class="garis-pemisah"></div>

    <!-- BAGIAN DAFTAR LAGU -->
    <button class="tombol-bagian" id="btnDaftarLagu">
        🎵 Daftar Lagu
        <span class="panah">➤</span>
    </button>
    <div class="konten-bagian" id="kontenDaftarLagu">
        <label class="pilih-folder">📁 PILIH FOLDER LAGU
            <input type="file" id="inputFolder" webkitdirectory multiple hidden accept="audio/*">
        </label>
        <div class="daftar-lagu-wrapper" id="daftarLaguDiMenu">
            <div style="text-align:center; padding:20px; opacity:0.6;">Belum ada lagu, silakan pilih folder</div>
        </div>
    </div>

    <!-- BAGIAN PENGATURAN -->
    <button class="tombol-bagian" id="btnPengaturan">
        ⚙️ Pengaturan
        <span class="panah">➤</span>
    </button>
    <div class="konten-bagian" id="kontenPengaturan">
        <div class="pengaturan-blok">
            <div class="judul-pengaturan">🔊 Penguat Suara (Booster)</div>
            <input type="range" min="10" max="150" value="100" class="slider-booster" id="boosterSuara">
            <div class="nilai-booster">Penguatan: <span id="nilaiBooster">100%</span></div>
            <div style="font-size: 12px; opacity: 0.7; margin-top: 6px; line-height: 1.5;">
                • 100% = Suara normal<br>
                • 101% - 150% = Lebih keras<br>
                • Atur volume dasar lewat tombol HP
            </div>
        </div>
    </div>
</div>

<!-- LACI TEMA -->
<div class="laci" id="laciTema">
    <div class="tombol-tutup" id="tutupTema">✕</div>
    <h3 class="judul-bagian">🎨 GANTI TEMA & LATAR</h3>
    <div class="garis-pemisah"></div>
    <div class="pilihan-tema" id="daftarTema"></div>
</div>

<!-- ISI UTAMA -->
<div class="isi-tengah">
    <div class="pemutar">
        <div class="wadah-gambar" id="wadahGambar">
            <img src="" alt="Gambar Lagu" class="gambar-lagu" id="gambarLagu">
            <input type="file" id="inputGambar" accept="image/*">
        </div>

        <div class="info-lagu">
            <div class="teks-sedang">SEDANG DIPUTAR</div>
            <div id="judul-lagu">— Belum ada lagu —</div>
        </div>

        <canvas id="visualGelombang"></canvas>

        <div class="batas-waktu" id="garisWaktu">
            <div class="isi-waktu" id="isiWaktu"></div>
        </div>
        <div class="waktu-tampil">
            <span id="waktuMulai">00:00</span>
            <span id="waktuSelesai">00:00</span>
        </div>

        <div class="tombol-kontrol">
            <button id="tombolAcak" title="Acak Semua Lagu">🔀</button>
            <button id="tombolMundur" title="Lagu Sebelumnya">⏮</button>
            <button id="tombolMain" class="utama" title="Putar / Jeda">▶</button>
            <button id="tombolMaju" title="Lagu Berikutnya">⏭</button>
            <button id="tombolUlang" title="Ulang 1 Lagu / Semua">🔁</button>
        </div>
    </div>
</div>

<script>
/* =========================================================
   🎨 DAFTAR TEMA
   ========================================================= */
const DAFTAR_TEMA = [
    { id:'tema-pelangi', nama:'Pelangi', warna:['#ff00c8','#00fff2'] },
    { id:'tema-ungu', nama:'Ungu', warna:['#c300ff','#7a00ff'] },
    { id:'tema-biru', nama:'Biru', warna:['#00e5ff','#0080ff'] },
    { id:'tema-merah', nama:'Merah', warna:['#ff0055','#ff8800'] },
    { id:'tema-hijau', nama:'Hijau', warna:['#00ff88','#88ff00'] },
    { id:'tema-emas', nama:'Emas', warna:['#ffd700','#ff8c00'] }
];

/* =========================================================
   📱 ELEMEN UTAMA
   ========================================================= */
const $ = id => document.getElementById(id);
const audio = new Audio();
audio.volume = 1.0;
let daftarLagu = [], indeksSekarang = 0, acakAktif = false, ulangAktif = 0; // 0 = mati, 1 = ulang 1, 2 = ulang semua
let gambarDefault = true;
let penguatSuara = 1.0;
let sedangGeser = false;

/* =========================================================
   🎛️ KONTROL LACI & DAFTAR ISI
   ========================================================= */
const tutupLatar = $('tutupLatar');
const laciUtama = $('laciUtama');
const laciTema = $('laciTema');
const tutupMenu = $('tutupMenu');
const tutupTema = $('tutupTema');

const btnDaftarLagu = $('btnDaftarLagu');
const kontenDaftarLagu = $('kontenDaftarLagu');
const btnPengaturan = $('btnPengaturan');
const kontenPengaturan = $('kontenPengaturan');

function bukaTutupBagian(tombol, konten){
    const sedangBuka = konten.classList.contains('buka');
    kontenDaftarLagu.classList.remove('buka');
    kontenPengaturan.classList.remove('buka');
    btnDaftarLagu.classList.remove('aktif');
    btnPengaturan.classList.remove('aktif');
    if(!sedangBuka){
        konten.classList.add('buka');
        tombol.classList.add('aktif');
    }
}

btnDaftarLagu.onclick = () => bukaTutupBagian(btnDaftarLagu, kontenDaftarLagu);
btnPengaturan.onclick = () => bukaTutupBagian(btnPengaturan, kontenPengaturan);

function bukaLaci(laci){
    laci.classList.add('buka');
    tutupLatar.classList.add('buka');
}
function tutupSemuaLaci(){
    laciUtama.classList.remove('buka');
    laciTema.classList.remove('buka');
    tutupLatar.classList.remove('buka');
}

$('bukaMenu').addEventListener('click', () => bukaLaci(laciUtama));
$('bukaTema').addEventListener('click', () => bukaLaci(laciTema));
tutupMenu.addEventListener('click', tutupSemuaLaci);
tutupTema.addEventListener('click', tutupSemuaLaci);
tutupLatar.addEventListener('click', tutupSemuaLaci);

/* =========================================================
   🖼️ GAMBAR LAGU
   ========================================================= */
const wadahGambar = $('wadahGambar');
const gambarLagu = $('gambarLagu');
const inputGambar = $('inputGambar');

wadahGambar.addEventListener('click', () => inputGambar.click());
inputGambar.addEventListener('change', e => {
    const file = e.target.files[0];
    if(!file) return;
    gambarLagu.src = URL.createObjectURL(file);
    gambarDefault = false;
    localStorage.setItem('gambarLaguPemutar', gambarLagu.src);
});

if(localStorage.getItem('gambarLaguPemutar')){
    gambarLagu.src = localStorage.getItem('gambarLaguPemutar');
    gambarDefault = false;
}else{
    gambarLagu.textContent = '🎵';
}

/* =========================================================
   🔊 SOUND BOOSTER
   ========================================================= */
const sliderBooster = $('boosterSuara');
const nilaiBooster = $('nilaiBooster');

sliderBooster.addEventListener('input', () => {
    const nilai = parseInt(sliderBooster.value);
    penguatSuara = nilai / 100;
    nilaiBooster.textContent = nilai + '%';
    if(audio.gainNode) audio.gainNode.gain.value = penguatSuara;
    localStorage.setItem('penguatSuara', nilai);
});

if(localStorage.getItem('penguatSuara')){
    const nilai = localStorage.getItem('penguatSuara');
    sliderBooster.value = nilai;
    penguatSuara = nilai / 100;
    nilaiBooster.textContent = nilai + '%';
}

/* =========================================================
   🎵 FUNGSI PEMUTAR & TOMBOL KONTROL
   ========================================================= */
const inputFolder = $('inputFolder');
const daftarMenu = $('daftarLaguDiMenu');
const judulLagu = $('judul-lagu');
const garisWaktu = $('garisWaktu');
const isiWaktu = $('isiWaktu');
const waktuMulai = $('waktuMulai');
const waktuSelesai = $('waktuSelesai');
const tombolMain = $('tombolMain');
const tombolMaju = $('tombolMaju');
const tombolMundur = $('tombolMundur');
const tombolAcak = $('tombolAcak');
const tombolUlang = $('tombolUlang');

inputFolder.addEventListener('change', e => {
    const file = [...e.target.files].filter(f => f.type.startsWith('audio/'));
    if(!file.length) return alert('❌ Tidak ada file lagu di folder ini');
    daftarLagu = file;
    indeksSekarang = 0;
    tampilkanDaftarLagu();
    muatLagu(0);
});

function tampilkanDaftarLagu(){
    daftarMenu.innerHTML = '';
    if(daftarLagu.length === 0){
        daftarMenu.innerHTML = `<div style="text-align:center; padding:20px; opacity:0.6;">Belum ada lagu</div>`;
        return;
    }
    daftarLagu.forEach((lagu, i) => {
        const elemen = document.createElement('div');
        elemen.className = `daftar-lagu-item ${i === indeksSekarang ? 'aktif' : ''}`;
        elemen.innerHTML = `
            <div class="nomor-lagu">${i+1}</div>
            <div class="nama-lagu">${lagu.name.replace(/\.[^/.]+$/, '')}</div>
        `;
        elemen.addEventListener('click', () => {
            indeksSekarang = i;
            muatLagu(i);
            audio.play();
            tombolMain.textContent = '⏸';
            gambarLagu.classList.add('putar');
            tutupSemuaLaci();
        });
        daftarMenu.appendChild(elemen);
    });
}

function muatLagu(i){
    if(!daftarLagu[i]) return;
    audio.src = URL.createObjectURL(daftarLagu[i]);
    judulLagu.textContent = daftarLagu[i].name.replace(/\.[^/.]+$/, '');
    if(gambarDefault){
        gambarLagu.textContent = '🎵';
        gambarLagu.src = '';
    }
    tampilkanDaftarLagu();
    waktuMulai.textContent = '00:00';
    waktuSelesai.textContent = '00:00';
    isiWaktu.style.width = '0%';
}

function putarLagu(){
    if(daftarLagu.length === 0) return alert('Pilih folder lagu terlebih dahulu!');
    if(audio.paused){
        audio.play();
        tombolMain.textContent = '⏸';
        gambarLagu.classList.add('putar');
    }else{
        audio.pause();
        tombolMain.textContent = '▶';
        gambarLagu.classList.remove('putar');
    }
}

function gantiLagu(arah){
    if(!daftarLagu.length) return;
    if(acakAktif){
        indeksSekarang = Math.floor(Math.random() * daftarLagu.length);
    }else{
        indeksSekarang = (indeksSekarang + arah + daftarLagu.length) % daftarLagu.length;
    }
    muatLagu(indeksSekarang);
    audio.play();
    tombolMain.textContent = '⏸';
    gambarLagu.classList.add('putar');
}

// ✅ FUNGSI TOMBOL ACAK & ULANG
tombolAcak.addEventListener('click', () => {
    acakAktif = !acakAktif;
    tombolAcak.classList.toggle('aktif', acakAktif);
    tombolAcak.title = acakAktif ? 'Acak Aktif' : 'Acak Mati';
});

tombolUlang.addEventListener('click', () => {
    ulangAktif = (ulangAktif + 1) % 3;
    tombolUlang.classList.remove('aktif');
    if(ulangAktif === 1){
        tombolUlang.classList.add('aktif');
        tombolUlang.textContent = '🔂';
        tombolUlang.title = 'Ulang 1 Lagu';
    }else if(ulangAktif === 2){
        tombolUlang.classList.add('aktif');
        tombolUlang.textContent = '🔁';
        tombolUlang.title = 'Ulang Semua Lagu';
    }else{
        tombolUlang.textContent = '🔁';
        tombolUlang.title = 'Ulang Mati';
    }
});

tombolMain.addEventListener('click', putarLagu);
tombolMaju.addEventListener('click', () => gantiLagu(1));
tombolMundur.addEventListener('click', () => gantiLagu(-1));

// ✅ FUNGSI GARIS WAKTU
audio.addEventListener('timeupdate', () => {
    if(!audio.duration || sedangGeser) return;
    const persen = (audio.currentTime / audio.duration) * 100;
    isiWaktu.style.width = persen + '%';
    waktuMulai.textContent = formatWaktu(audio.currentTime);
    waktuSelesai.textContent = formatWaktu(audio.duration);
});

audio.addEventListener('loadedmetadata', () => {
    waktuSelesai.textContent = formatWaktu(audio.duration);
});

audio.addEventListener('ended', () => {
    if(ulangAktif === 1){
        audio.currentTime = 0;
        audio.play();
    }else if(ulangAktif === 2){
        gantiLagu(1);
    }else{
        tombolMain.textContent = '▶';
        gambarLagu.classList.remove('putar');
    }
});

function geserWaktu(e){
    if(!audio.duration) return;
    sedangGeser = true;
    const lebar = garisWaktu.getBoundingClientRect().width;
    const posisiX = e.clientX || (e.touches && e.touches[0].clientX);
    const posisiKiri = garisWaktu.getBoundingClientRect().left;
    const persen = Math.max(0, Math.min(1, (posisiX - posisiKiri) / lebar));
    isiWaktu.style.width = persen * 100 + '%';
    waktuMulai.textContent = formatWaktu(persen * audio.duration);
}

function selesaiGeserWaktu(){
    if(!audio.duration) return;
    const persen = parseFloat(isiWaktu.style.width) / 100;
    audio.currentTime = persen * audio.duration;
    sedangGeser = false;
}

garisWaktu.addEventListener('mousedown', (e) => { geserWaktu(e); garisWaktu.addEventListener('mousemove', geserWaktu); });
garisWaktu.addEventListener('mouseup', () => { selesaiGeserWaktu(); garisWaktu.removeEventListener('mousemove', geserWaktu); });
garisWaktu.addEventListener('mouseleave', () => { selesaiGeserWaktu(); garisWaktu.removeEventListener('mousemove', geserWaktu); });

garisWaktu.addEventListener('touchstart', (e) => geserWaktu(e), { passive: true });
garisWaktu.addEventListener('touchmove', (e) => geserWaktu(e), { passive: true });
garisWaktu.addEventListener('touchend', selesaiGeserWaktu);
garisWaktu.addEventListener('touchcancel', selesaiGeserWaktu);

function formatWaktu(detik){
    if(isNaN(detik)) return '00:00';
    const m = Math.floor(detik / 60);
    const d = Math.floor(detik % 60);
    return `${m}:${d < 10 ? '0' + d : d}`;
}

/* =========================================================
   🎨 TAMPILKAN TEMA
   ========================================================= */
function tampilkanTema(){
    const daftarTema = $('daftarTema');
    daftarTema.innerHTML = '';
    const temaAktif = document.body.className;
    DAFTAR_TEMA.forEach(tema => {
        const kartu = document.createElement('div');
        kartu.className = `kartu-tema ${temaAktif === tema.id ? ' aktif' : ''}`;
        kartu.innerHTML = `<div class="bulet-tema" style="background: linear-gradient(135deg, ${tema.warna[0]}, ${tema.warna[1]})"></div><span>${tema.nama}</span>`;
        kartu.addEventListener('click', () => {
            document.body.className = tema.id;
            tampilkanTema();
            tutupSemuaLaci();
            localStorage.setItem('temaTerpilih', tema.id);
        });
        daftarTema.appendChild(kartu);
    });
}

if(localStorage.getItem('temaTerpilih')) document.body.className = localStorage.getItem('temaTerpilih');
tampilkanTema();

/* =========================================================
   📊 VISUAL GELOMBANG SUARA
   ========================================================= */
const kanvas = $('visualGelombang');
const konteks = kanvas.getContext('2d');
let analisa, sumber, gainNode;

audio.addEventListener('play', () => {
    if(analisa) return;
    const konteksAudio = new (window.AudioContext || window.webkitAudioContext)();
    sumber = konteksAudio.createMediaElementSource(audio);
    analisa = konteksAudio.createAnalyser();
    gainNode = konteksAudio.createGain();
    gainNode.gain.value = penguatSuara;
    audio.gainNode = gainNode;
    analisa.fftSize = 128;
    sumber.connect(gainNode);
    gainNode.connect(analisa);
    analisa.connect(konteksAudio.destination);
    gambarGelombang();
});

function gambarGelombang(){
    requestAnimationFrame(gambarGelombang);
    if(!analisa) return;
    const data = new Uint8Array(analisa.frequencyBinCount);
    analisa.getByteFrequencyData(data);
    const lebar = kanvas.width = kanvas.offsetWidth * 2;
    const tinggi = kanvas.height = 140;
    konteks.clearRect(0, 0, lebar, tinggi);
    const lebarBatang = lebar / data.length;
    for(let i = 0; i < data.length; i++){
        const tinggiBatang = (data[i] / 255) * tinggi;
        const gradasi = konteks.createLinearGradient(0, tinggi - tinggiBatang, 0, tinggi);
        gradasi.addColorStop(0, getComputedStyle(document.body).getPropertyValue('--neon1'));
        gradasi.addColorStop(1, getComputedStyle(document.body).getPropertyValue('--neon2'));
        konteks.fillStyle = gradasi;
        konteks.shadowBlur = 10;
        konteks.shadowColor = getComputedStyle(document.body).getPropertyValue('--neon1');
        konteks.fillRect(i * lebarBatang + 2, tinggi - tinggiBatang, lebarBatang - 4, tinggiBatang);
    }
}
</script>
