<style>
:root{
    --gambar-latar: url('https://i.ibb.co/mCJdjydg/FB-IMG-1779332724114.jpg');
    --neon1:#ff00c8; --neon2:#00fff2; --neon3:#b700ff;
    --bg1:#050010; --bg2:#150030; --text:#fff;
    --atas: env(safe-area-inset-top, 12px);
    --bawah: env(safe-area-inset-bottom, 16px);
    --kiri: env(safe-area-inset-left, 12px);
    --kanan: env(safe-area-inset-right, 12px);
}

/* TEMA */
body.tema-pelangi{ --neon1:#ff00c8; --neon2:#00fff2; --neon3:#b700ff; --bg1:#050010; --bg2:#150030; }
body.tema-ungu{   --neon1:#c300ff; --neon2:#7a00ff; --neon3:#ff00aa; --bg1:#0f0020; --bg2:#1e0040; }
body.tema-biru{   --neon1:#00e5ff; --neon2:#0080ff; --neon3:#00ffd5; --bg1:#000814; --bg2:#001530; }
body.tema-merah{  --neon1:#ff0055; --neon2:#ff8800; --neon3:#ffff00; --bg1:#140005; --bg2:#2a0010; }
body.tema-hijau{  --neon1:#00ff88; --neon2:#88ff00; --neon3:#00ffcc; --bg1:#001408; --bg2:#002a10; }
body.tema-emas{   --neon1:#ffd700; --neon2:#ff8c00; --neon3:#fff200; --bg1:#140d00; --bg2:#2a1a00; }

*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;transition:all .25s ease}
html,body{width:100%;min-height:100dvh;height:100dvh;overflow:hidden}
body{
    background-image:
        linear-gradient(160deg,rgba(0,0,0,.6),rgba(0,0,0,.78)),
        var(--gambar-latar),
        radial-gradient(ellipse at top,var(--bg2),var(--bg1) 80%);
    background-size:cover;background-position:center;background-attachment:fixed;
    display:flex;flex-direction:column;
    padding:var(--atas) var(--kanan) var(--bawah) var(--kiri)
}

/* HEADER */
.header{position:fixed;top:var(--atas);left:var(--kiri);right:var(--kanan);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:990;background:rgba(0,0,0,.25);backdrop-filter:blur(10px);border-radius:14px;margin:8px 0}
.judul-aplikasi{display:flex;align-items:center;gap:10px;font-size:clamp(20px,5vw,26px);font-weight:900;text-shadow:0 0 6px var(--neon1),0 0 12px var(--neon2)}
.tombol-menu,.tombol-tema{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);border:1.5px solid var(--neon2);display:grid;place-items:center;font-size:20px;cursor:pointer}
.tombol-tema{border-color:var(--neon1);box-shadow:0 0 8px var(--neon1);}

/* LACI */
.laci{position:fixed;top:0;right:0;height:100dvh;width:min(95vw,520px);background:linear-gradient(180deg,rgba(15,0,35,.96),rgba(0,0,0,.94));border-left:2px solid var(--neon1);box-shadow:-10px 0 30px rgba(0,0,0,.4);backdrop-filter:blur(16px);transform:translateX(110%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:1000;padding:calc(25px + var(--atas)) 20px;overflow-y:auto}
.laci.buka{transform:translateX(0)}
.tutup-latar{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:999;opacity:0;pointer-events:none;transition:.3s}
.tutup-latar.buka{opacity:1;pointer-events:auto}
.tombol-tutup{position:absolute;top:15px;right:15px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);border:1.5px solid var(--neon1);display:grid;place-items:center;cursor:pointer;box-shadow:0 0 8px var(--neon1);}
.judul-bagian{font-size:22px;font-weight:700;margin-bottom:15px;text-shadow:0 0 8px var(--neon1)}
.garis-pemisah{height:2px;margin:12px 0 20px;border-radius:2px;background:linear-gradient(90deg,var(--neon1),var(--neon2),transparent);}
.tombol-bagian{width:100%;padding:14px 16px;margin:0 0 12px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);text-align:left;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:.2s}
.tombol-bagian:hover,.tombol-bagian.aktif{background:rgba(255,0,200,.15);border-color:var(--neon1);box-shadow:0 0 10px rgba(255,0,200,.2);}
.konten-bagian{max-height:0;overflow:hidden;transition:max-height .4s ease;margin-bottom:15px}
.konten-bagian.buka{max-height:80vh}

/* ✅ PERBAIKAN TAMPILAN TEMA */
.pilihan-tema{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:15px}
.kartu-tema{padding:16px;border-radius:16px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);display:flex;align-items:center;gap:12px;cursor:pointer;transition:.3s;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.kartu-tema:hover,.kartu-tema.aktif{border-color:var(--neon2);background:rgba(255,0,200,.15);box-shadow:0 0 15px var(--neon1);transform:scale(1.03);}
.bulet-tema{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--neon1),var(--neon2));box-shadow:0 0 10px var(--neon1);}

.daftar-lagu-wrapper{max-height:55vh;overflow-y:auto;border-radius:12px;background:rgba(0,0,0,.25);padding:8px}
.daftar-lagu-item{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:6px 0;border-radius:10px;background:rgba(255,255,255,.05);cursor:pointer;transition:.2s}
.daftar-lagu-item:hover,.daftar-lagu-item.aktif{background:rgba(255,0,200,.18);border-left:3px solid var(--neon2);padding-left:11px;}
.nomor-lagu{min-width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--neon1),var(--neon2));color:#000;display:grid;place-items:center;font-weight:700}
.pilih-folder{display:block;width:100%;padding:14px;margin:10px 0;border-radius:12px;border:1.5px dashed var(--neon2);background:rgba(0,0,0,.25);text-align:center;cursor:pointer;transition:.2s}
.pilih-folder:hover{background:rgba(0,0,0,.3);border-color:var(--neon1);}
.pengaturan-blok{padding:16px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);}
.slider-booster{width:100%;height:8px;border-radius:99px;background:rgba(255,255,255,.15);-webkit-appearance:none;outline:none;margin:10px 0}
.slider-booster::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--neon1),var(--neon2));box-shadow:0 0 10px var(--neon1);cursor:pointer}

/* PEMUTAR */
.isi-tengah{margin-top:80px;flex:1;overflow-y:auto;padding:15px 5% 25px}
.isi-tengah.dengan-tombol{padding-bottom:180px}
.pemutar{width:100%;max-width:450px;margin:10px auto;padding:clamp(18px,5vw,25px);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(0,0,0,.45));backdrop-filter:blur(12px);position:relative;border:1.5px solid rgba(255,255,255,.1);box-shadow:0 8px 32px rgba(0,0,0,.3);}
.wadah-gambar{width:min(45vw,190px);aspect-ratio:1/1;margin:10px auto 18px;border-radius:50%;overflow:hidden;background:radial-gradient(circle,#222,#111);display:flex;align-items:center;justify-content:center;box-shadow:0 0 15px var(--neon1),0 0 30px var(--neon2);cursor:pointer}
.gambar-lagu{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gambar-lagu.putar{animation:putar 8s linear infinite}
@keyframes putar{to{transform:rotate(360deg)}}
.info-lagu{text-align:center;margin-bottom:12px}
#judul-lagu{font-size:clamp(14px,4vw,17px);font-weight:700;text-shadow:0 0 6px var(--neon1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
canvas{width:100%;height:clamp(55px,12vw,75px);margin:12px 0;border-radius:14px;background:rgba(0,0,0,.25)}
.batas-waktu{width:100%;height:8px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;cursor:pointer;margin:12px 0}
.isi-waktu{height:100%;width:0%;background:linear-gradient(90deg,var(--neon1),var(--neon2));transition:width .1s linear}
.waktu-tampil{display:flex;justify-content:space-between;font-size:13px;margin-bottom:16px;opacity:.9}
.tombol-kontrol{display:flex;justify-content:center;align-items:center;gap:clamp(10px,3vw,18px);margin:12px 0}
.tombol-kontrol button{width:clamp(42px,12vw,52px);height:clamp(42px,12vw,52px);border-radius:50%;border:1.5px solid var(--neon2);background:rgba(255,255,255,.06);font-size:clamp(16px,4.5vw,20px);cursor:pointer;transition:.2s}
.tombol-kontrol button:hover{box-shadow:0 0 10px var(--neon1);}
.tombol-kontrol .utama{width:clamp(58px,16vw,70px);height:clamp(58px,16vw,70px);background:linear-gradient(135deg,var(--neon1),var(--neon2));border-color:#fff;font-size:clamp(22px,6vw,28px);box-shadow:0 0 15px var(--neon1);}
.tombol-kontrol .aktif{background:rgba(255,0,200,.3);border-color:var(--neon1);box-shadow:0 0 10px var(--neon1);}

/* ✅ TOMBOL INSTAL */
#tombolInstal{
    position:fixed;left:0;right:0;bottom:0;
    padding:12px max(12px,env(safe-area-inset-left))
             calc(12px + env(safe-area-inset-bottom))
             max(12px,env(safe-area-inset-right));
    background:linear-gradient(180deg,transparent,rgba(0,0,0,.92));
    display:flex;flex-direction:column;gap:15px;justify-content:center;z-index:900;
    transform:translateY(0);opacity:1;transition:all .4s
}
#tombolInstal.sembunyi{transform:translateY(115%);opacity:0;pointer-events:none}

.tombol-play{
    display:inline-flex;align-items:center;gap:12px;
    background:#000;color:#fff;border:1.5px solid #fff;border-radius:12px;
    padding:9px 18px;cursor:pointer;max-width:280px;width:100%;margin:0 auto;
    box-shadow:0 6px 22px rgba(0,0,0,.6);transition:.2s
}
.tombol-play:active{transform:scale(.97)}
.tombol-play .ikon{
    width:34px;height:34px;border-radius:7px;flex-shrink:0;
    background-image:url('https://i.ibb.co/mCJdjydg/FB-IMG-1779332724114.jpg');
    background-size:cover;background-position:center;
    border:1px solid rgba(255,255,255,.2)
}
.tombol-play .teks{line-height:1.15;text-align:left}
.tombol-play .teks small{display:block;font-size:10px;opacity:.8;color:#ddd}
.tombol-play .teks b{display:block;font-size:15px;color:#fff;font-weight:800}

/* ✅ GAYA SOSIAL MEDIA DENGAN GAMBAR */
.media-sosial-wrapper {
  text-align: center;

.media-sosial a {
  width: 46px;

  border-radius: 50%;

  place-items: center;
  padding: 7px;
  border: 1.5px solid transparent;

  transition: all 0.3s ease;

}
.media-sosial a:hover {
  background: rgba(255, 255, 255, 0.18);
  border-color: var(--neon1);
  box-shadow: 0 0 14px var(--neon1);
  transform: scale(1.15);
}
.media-sosial a:active {
  transform: scale(0.95);
}
.media-sosial a img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 50%;
}
</style>
</head>

<script>
/* ============ PWA SERVICE WORKER ============ */
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});

/* ============ PEMASANGAN APLIKASI ============ */
let acaraPasang = null;
const tombolArea = document.getElementById('tombolInstal');
const tombolPasang = document.getElementById('klikPasang');
const isi = document.getElementById('isi');
const KUNCI = 'winoro_terpasang';

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  acaraPasang = e;
  if(localStorage.getItem(KUNCI) !== '1') tombolArea.classList.remove('sembunyi');
});

tombolPasang.addEventListener('click', async () => {
  if(!acaraPasang) return;
  const hasil = await acaraPasang.prompt();
  if(hasil && hasil.outcome === 'accepted'){
    localStorage.setItem(KUNCI, '1');
    tombolArea.classList.add('sembunyi');
    isi.classList.remove('dengan-tombol');
  }
  acaraPasang = null;
});

function cekMode(){
  const sdh = localStorage.getItem(KUNCI) === '1';
  const app = window.matchMedia('(display-mode: standalone)').matches
           || window.matchMedia('(display-mode: fullscreen)').matches
           || window.navigator.standalone === true;
  if(sdh || app){
    tombolArea.classList.add('sembunyi');
    isi.classList.remove('dengan-tombol');
  }
}
cekMode();
window.addEventListener('appinstalled', () => {
  localStorage.setItem(KUNCI, '1');
  tombolArea.classList.add('sembunyi');
  isi.classList.remove('dengan-tombol');
});

/* ============ FITUR SALIN TAUTAN SOSIAL ============ */
document.querySelectorAll('.media-sosial a').forEach(ikon => {
  let tahan;
  ikon.addEventListener('touchstart', () => {
    tahan = setTimeout(() => {
      const link = ikon.dataset.link;
      navigator.clipboard.writeText(link).then(() => {
        alert('✅ Tautan berhasil disalin:\n' + link);
      }).catch(() => alert('❌ Gagal menyalin tautan'));
    }, 800); // Tahan 0,8 detik untuk salin
  }, {passive:true});
  ikon.addEventListener('touchend', () => clearTimeout(tahan), {passive:true});
  ikon.addEventListener('touchmove', () => clearTimeout(tahan), {passive:true});

  // Untuk komputer
  ikon.addEventListener('contextmenu', e => {
    e.preventDefault();
    const link = ikon.dataset.link;
    navigator.clipboard.writeText(link).then(() => {
      alert('✅ Tautan berhasil disalin:\n' + link);
    });
  });
});

/* ============ SISA FUNGSI APLIKASI ============ */
const $ = id => document.getElementById(id);
const GAMBAR = 'https://i.ibb.co/mCJdjydg/FB-IMG-1779332724114.jpg';
const TEMA = [
  ['tema-pelangi','Pelangi'],
  ['tema-ungu','Ungu'],
  ['tema-biru','Biru'],
  ['tema-merah','Merah'],
  ['tema-hijau','Hijau'],
  ['tema-emas','Emas']
];
document.documentElement.style.setProperty('--gambar-latar',`url('${GAMBAR}')`);

const audio = new Audio(); audio.volume=1;
let daftar=[], idx=0, acak=false, ulang=0, booster=1, geser=false;

$('bukaMenu').onclick = ()=>{$('laciUtama').classList.add('buka');$('tutupLatar').classList.add('buka')};
$('bukaTema').onclick = ()=>{$('laciTema').classList.add('buka');$('tutupLatar').classList.add('buka')};
$('tutupMenu').onclick = $('tutupTema').onclick = $('tutupLatar').onclick = ()=>{
  $('laciUtama').classList.remove('buka');$('laciTema').classList.remove('buka');$('tutupLatar').classList.remove('buka');
};
document.querySelectorAll('.tombol-bagian').forEach(b=>{
  b.onclick=()=>{
    const t=b.dataset.buka;
    const buka = document.getElementById('bagian-'+t);
    document.querySelectorAll('.konten-bagian').forEach(x=>x.classList.remove('buka'));
    document.querySelectorAll('.tombol-bagian').forEach(x=>x.classList.remove('aktif'));
    buka.classList.add('buka'); b.classList.add('aktif');
  }
});

$('wadah').onclick = ()=>$('gantiCover').click();
$('gantiCover').onchange = e=>{
  const f=e.target.files[0]; if(!f) return;
  $('cover').src = URL.createObjectURL(f); $('cover').hidden=false;
};

$('booster').oninput = e=>{
  const v=+e.target.value; $('nilaiB').textContent=v+'%'; booster=v/100;
  if(audio.gainNode) audio.gainNode.gain.value=booster;
  localStorage.setItem('b',v);
};
if(localStorage.getItem('b')){const v=+localStorage.getItem('b');$('booster').value=v;$('nilaiB').textContent=v+'%';booster=v/100}

$('inputFolder').onchange = e=>{
  const f=[...e.target.files].filter(x=>x.type.startsWith('audio/'));
  if(!f.length) return alert('❌ Tidak ada file lagu di folder ini');
  daftar=f; idx=0; tampil(); muat(0);
};
function tampil(){
  const w=$('daftarLagu'); w.innerHTML='';
  daftar.forEach((f,i)=>{
    const el=document.createElement('div');
    el.className='daftar-lagu-item'+(i===idx?' aktif':'');
    el.innerHTML=`<div class="nomor-lagu">${i+1}</div><div>${f.name.replace(/\.[^.]+$/,'')}</div>`;
    el.onclick=()=>{idx=i;muat(i);audio.play();$('main').textContent='⏸';$('cover').classList.add('putar')};
    w.appendChild(el);
  });
}
function muat(i){
  if(!daftar[i]) return;
  audio.src=URL.createObjectURL(daftar[i]);
  $('judul-lagu').textContent=daftar[i].name.replace(/\.[^.]+$/,'');
  $('isiBar').style.width='0%';$('skrg').textContent='00:00';$('tot').textContent='00:00';
  tampil();
}
$('main').onclick = ()=>{
  if(!daftar.length) return alert('📁 Silakan pilih folder lagu terlebih dahulu');
  if(audio.paused){audio.play();$('main').textContent='⏸';$('cover').classList.add('putar')}
  else{audio.pause();$('main').textContent='▶';$('cover').classList.remove('putar')}
};
function ganti(a){
  if(!daftar.length) return;
  idx = acak ? Math.floor(Math.random()*daftar.length) : (idx+a+daftar.length)%daftar.length;
  muat(idx); audio.play(); $('main').textContent='⏸'; $('cover').classList.add('putar');
}
$('maju').onclick = ()=>ganti(1);
$('mundur').onclick = ()=>ganti(-1);
$('acak').onclick = ()=>{acak=!acak;$('acak').classList.toggle('aktif',acak)};
$('ulang').onclick = ()=>{
  ulang=(ulang+1)%3; $('ulang').classList.remove('aktif');
  if(ulang===1){$('ulang').classList.add('aktif');$('ulang').textContent='🔂'}
  else if(ulang===2){$('ulang').classList.add('aktif');$('ulang').textContent='🔁'}
  else $('ulang').textContent='🔁';
};
audio.ontimeupdate=()=>{
  if(!audio.duration||geser) return;
  const p=audio.currentTime/audio.duration*100;
  $('isiBar').style.width=p+'%'; $('skrg').textContent=fmt(audio.currentTime);
};
audio.onloadedmetadata=()=>$('tot').textContent=fmt(audio.duration);
audio.onended=()=>{
  if(ulang===1){audio.currentTime=0;audio.play()}
  else if(ulang===2) ganti(1)
  else{$('main').textContent='▶';$('cover').classList.remove('putar')}
};
const bar=$('bar');
function pos(e){const r=bar.getBoundingClientRect();const x=e.clientX||(e.touches&&e.touches[0].clientX);return Math.max(0,Math.min(1,(x-r.left)/r.width))}
bar.addEventListener('mousedown',e=>{geser=true;const p=pos(e);$('isiBar').style.width=p*100+'%';$('skrg').textContent=fmt(p*audio.duration)});
bar.addEventListener('mousemove',e=>{if(!geser) return;const p=pos(e);$('isiBar').style.width=p*100+'%';$('skrg').textContent=fmt(p*audio.duration)});
const lepas=()=>{if(!geser) return;geser=false;audio.currentTime=parseFloat($('isiBar').style.width)/100*audio.duration};
addEventListener('mouseup',lepas);
bar.addEventListener('touchstart',e=>{geser=true},{passive:true});
bar.addEventListener('touchmove',e=>{const p=pos(e);$('isiBar').style.width=p*100+'%';$('skrg').textContent=fmt(p*audio.duration)},{passive:true});
bar.addEventListener('touchend',lepas);
function fmt(d){if(isNaN(d)) return '00:00';const m=Math.floor(d/60),s=Math.floor(d%60);return `${m}:${s<10?'0'+s:s}`}

// Tampilkan daftar tema
const wadahTema=$('pilihTema');
TEMA.forEach(([id,nama])=>{
  const el=document.createElement('div');el.className='kartu-tema';
  el.innerHTML=`<div class="bulet-tema"></div><span>${nama}</span>`;
  el.onclick=()=>{
    document.body.className=id; localStorage.setItem('tema',id);
    tampilTemaAktif();
    $('laciTema').classList.remove('buka');$('tutupLatar').classList.remove('buka');
  };
  wadahTema.appendChild(el);
});
function tampilTemaAktif(){
  const aktif = document.body.className;
  document.querySelectorAll('.kartu-tema').forEach((el,i)=>{
    el.classList.toggle('aktif', TEMA[i][0] === aktif);
  });
}
if(localStorage.getItem('tema')) document.body.className=localStorage.getItem('tema');
tampilTemaAktif();

// Visualisasi gelombang suara
const cv=$('gel'), ctx=cv.getContext('2d');
audio.addEventListener('play',()=>{
  if(audio._an) return;
  const AC=new (window.AudioContext||window.webkitAudioContext)();
  const src=AC.createMediaElementSource(audio);
  const an=AC.createAnalyser(); an.fftSize=128;
  const gn=AC.createGain(); gn.gain.value=booster; audio.gainNode=gn;
  src.connect(gn); gn.connect(an); an.connect(AC.destination);
  audio._an=an; jalan();
});
function jalan(){
  requestAnimationFrame(jalan);
  const an=audio._an; if(!an) return;
  const d=new Uint8Array(an.frequencyBinCount); an.getByteFrequencyData(d);
  const W=cv.width=cv.offsetWidth*2, H=cv.height=140; ctx.clearRect(0,0,W,H);
  const bw=W/d.length;
  const warna1 = getComputedStyle(document.body).getPropertyValue('--neon1');
  const warna2 = getComputedStyle(document.body).getPropertyValue('--neon2');
  for(let i=0;i<d.length;i++){
    const h=(d[i]/255)*H;
    const grad = ctx.createLinearGradient(0,H-h,0,H);
    grad.addColorStop(0, warna1);
    grad.addColorStop(1, warna2);
    ctx.fillStyle=grad;
    ctx.shadowBlur=10;
    ctx.shadowColor=warna1;
    ctx.fillRect(i*bw+2,H-h,bw-4,h);
  }
}
