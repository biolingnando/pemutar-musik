<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a001a">
<title>🎵 WINORO MUSIC</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
/* =========================================================
   🖼️ TEMPAT TEMPEL LINK GAMBAR LATAR DARI IMGBB
   ========================================================= */
:root{
    --gambar-latar: url('');
    --neon1:#ff00c8; --neon2:#00fff2; --neon3:#b700ff;
    --bg1:#050010; --bg2:#150030; --text:#ffffff;
    --atas: env(safe-area-inset-top, 12px);
    --bawah: env(safe-area-inset-bottom, 16px);
    --kiri: env(safe-area-inset-left, 12px);
    --kanan: env(safe-area-inset-right, 12px);
}

/* 🎨 SETIAP TEMA */
body.tema-pelangi{ --gambar-latar: url(''); --neon1:#ff00c8; --neon2:#00fff2; --neon3:#b700ff; --bg1:#050010; --bg2:#150030; }
body.tema-ungu{ --gambar-latar: url(''); --neon1:#c300ff; --neon2:#7a00ff; --neon3:#ff00aa; --bg1:#0f0020; --bg2:#1e0040; }
body.tema-biru{ --gambar-latar: url(''); --neon1:#00e5ff; --neon2:#0080ff; --neon3:#00ffd5; --bg1:#000814; --bg2:#001530; }
body.tema-merah{ --gambar-latar: url(''); --neon1:#ff0055; --neon2:#ff8800; --neon3:#ffff00; --bg1:#140005; --bg2:#2a0010; }
body.tema-hijau{ --gambar-latar: url(''); --neon1:#00ff88; --neon2:#88ff00; --neon3:#00ffcc; --bg1:#001408; --bg2:#002a10; }
body.tema-emas{ --gambar-latar: url(''); --neon1:#ffd700; --neon2:#ff8c00; --neon3:#fff200; --bg1:#140d00; --bg2:#2a1a00; }

*{
    margin:0; padding:0; box-sizing:border-box;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    touch-action: manipulation;
    user-select: none;
    transition: all 0.25s ease;
}

html, body{
    width: 100%;
    min-height: 100dvh;
    height: 100dvh;
    overflow: hidden;
}

body{
    background-image:
        linear-gradient(160deg, rgba(0,0,0,0.6), rgba(0,0,0,0.78)),
        var(--gambar-latar),
        radial-gradient(ellipse at top, var(--bg2), var(--bg1) 80%);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    display: flex;
    flex-direction: column;
    padding: var(--atas) var(--kanan) var(--bawah) var(--kiri);
}

/* =========================================================
   🎯 HEADER & JUDUL APLIKASI
   ========================================================= */
.header{
    position: fixed;
    top: var(--atas);
    left: var(--kiri);
    right: var(--kanan);
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 990;
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(10px);
    border-radius: 14px;
    margin: 8px 0;
}

.judul-aplikasi{
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: clamp(20px, 5vw, 26px);
    font-weight: 900;
    letter-spacing: 1px;
    text-shadow: 0 0 6px var(--neon1), 0 0 12px var(--neon2);
    animation: nyala 2s ease-in-out infinite alternate;
}

.judul-aplikasi .icon{
    font-size: 1.2em;
    filter: drop-shadow(0 0 8px var(--neon3));
    animation: goyang 1.5s ease-in-out infinite;
}

@keyframes nyala { from { filter: brightness(0.9); } to { filter: brightness(1.4); } }
@keyframes goyang { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }

/* =========================================================
   📱 TOMBOL MENU & LACI
   ========================================================= */
.tombol-menu{
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid var(--neon2);
    box-shadow: 0 0 10px var(--neon1);
    display: grid;
    place-items: center;
    font-size: 20px;
    cursor: pointer;
    backdrop-filter: blur(8px);
}
.tombol-menu:active{ transform: scale(0.9); box-shadow: 0 0 15px var(--neon2); }

.tombol-tema{
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid var(--neon1);
    box-shadow: 0 0 10px var(--neon2);
    display: grid;
    place-items: center;
    font-size: 20px;
    cursor: pointer;
    backdrop-filter: blur(8px);
}
.tombol-tema:active{ transform: scale(0.9); }

/* ✅ TOMBOL TUTUP SILANG DI LACI */
.tombol-tutup{
    position: absolute;
    top: 15px;
    right: 15px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1.5px solid var(--neon1);
    box-shadow: 0 0 8px var(--neon1);
    display: grid;
    place-items: center;
    font-size: 18px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: 0.2s;
}
.tombol-tutup:hover{
    background: rgba(255,0,200,0.2);
    transform: scale(1.05);
}
.tombol-tutup:active{
    transform: scale(0.9);
}

.laci{
    position: fixed;
    top: 0;
    right: 0;
    height: 100dvh;
    width: min(85vw, 340px);
    background: linear-gradient(180deg, rgba(15,0,35,0.94), rgba(0,0,0,0.92));
    border-left: 2px solid var(--neon1);
    box-shadow: -12px 0 40px rgba(255,0,200,0.28);
    backdrop-filter: blur(16px);
    transform: translateX(110%);
    transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    padding: calc(25px + var(--atas)) 20px;
    overflow-y: auto;
    z-index: 1000;
}
.laci.buka{ transform: translateX(0); }

.tutup-latar{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s;
}
.tutup-latar.buka{ opacity: 1; pointer-events: auto; }

.laci h3{
    font-size: 19px;
    margin-bottom: 12px;
    text-shadow: 0 0 8px var(--neon1);
    display: flex;
    align-items: center;
    gap: 8px;
}
.garis-pemisah{
    height: 2px;
    background: linear-gradient(90deg, var(--neon1), var(--neon2), transparent);
    margin: 12px 0 18px;
    border-radius: 2px;
}

/* =========================================================
   🎵 PEMUTAR MUSIK
   ========================================================= */
.isi-tengah{
    margin-top: 80px;
    flex: 1;
    overflow-y: auto;
    padding: 15px 5% 25px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}
.isi-tengah::-webkit-scrollbar{ display: none; }

.pemutar{
    width: 100%;
    max-width: 450px;
    margin: 10px auto;
    padding: clamp(18px, 5vw, 25px);
    border-radius: 24px;
    background: linear-gradient(145deg, rgba(255,255,255,0.07), rgba(0,0,0,0.45));
    border: 1.5px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    position: relative;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
.pemutar::before{
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 26px;
    padding: 2px;
    background: linear-gradient(135deg, var(--neon1), var(--neon2), var(--neon3), var(--neon1));
    background-size: 300% 300%;
    animation: putarWarna 7s linear infinite;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
}
@keyframes putarWarna { to { background-position: 300% 50%; } }

/* 🖼️ GAMBAR PIRINGAN BISA DIKLIK */
.wadah-gambar{
    width: min(45vw, 190px);
    aspect-ratio: 1/1;
    margin: 10px auto 18px;
    position: relative;
    cursor: pointer;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 15px var(--neon1), 0 0 30px var(--neon2);
    transition: transform 0.3s;
}
.wadah-gambar:active{ transform: scale(0.96); }

.gambar-lagu{
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: radial-gradient(circle, #222 0%, #111 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(30px, 8vw, 40px);
    color: var(--neon3);
}
.gambar-lagu.putar{ animation: putar 8s linear infinite; }
@keyframes putar { to { transform: rotate(360deg); } }

#input-gambar{ display: none; }

.info-lagu{
    text-align: center;
    margin-bottom: 12px;
}
.teks-sedang{
    font-size: 12px;
    opacity: 0.7;
    letter-spacing: 1px;
    margin-bottom: 6px;
}
#judul-lagu{
    font-size: clamp(14px, 4vw, 17px);
    font-weight: 700;
    text-shadow: 0 0 6px var(--neon1);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 8px;
}

canvas{
    width: 100%;
    height: clamp(55px, 12vw, 75px);
    margin: 12px 0;
    border-radius: 14px;
    background: rgba(0,0,0,0.25);
}

.batas-waktu{
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.15);
    border-radius: 99px;
    cursor: pointer;
    overflow: hidden;
    margin: 8px 0;
}
.isi-waktu{
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--neon1), var(--neon2));
    box-shadow: 0 0 10px var(--neon1);
    border-radius: 99px;
}
.waktu-tampil{
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    opacity: 0.8;
    margin-bottom: 12px;
}

.tombol-kontrol{
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(10px, 3vw, 18px);
    margin: 12px 0;
}
.tombol-kontrol button{
    width: clamp(42px, 12vw, 52px);
    height: clamp(42px, 12vw, 52px);
    border-radius: 50%;
    border: 1.5px solid var(--neon2);
    background: rgba(255,255,255,0.06);
    box-shadow: 0 0 8px var(--neon1);
    font-size: clamp(16px, 4.5vw, 20px);
    cursor: pointer;
    display: grid;
    place-items: center;
}
.tombol-kontrol button:active{ transform: scale(0.9); }
.tombol-kontrol .utama{
    width: clamp(58px, 16vw, 70px);
    height: clamp(58px, 16vw, 70px);
    font-size: clamp(22px, 6vw, 28px);
    background: linear-gradient(135deg, var(--neon1), var(--neon2));
    border-color: #fff;
    box-shadow: 0 0 15px var(--neon1);
}

.baris-volume{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 15px;
}
#tombolBisukan{
    font-size: 22px;
    cursor: pointer;
    color: var(--neon2);
    text-shadow: 0 0 6px var(--neon2);
}
#garisVolume{
    flex: 1;
    height: 5px;
    border-radius: 99px;
    background: rgba(255,255,255,0.15);
    outline: none;
    -webkit-appearance: none;
}
#garisVolume::-webkit-slider-thumb{
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px var(--neon1);
    cursor: pointer;
}

/* =========================================================
   📋 DAFTAR LAGU & SOUND BOOSTER
   ========================================================= */
.daftar-lagu-item{
    padding: 12px 14px;
    margin: 6px 0;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    border-left: 3px solid var(--neon1);
    cursor: pointer;
    font-size: 14px;
    transition: 0.2s;
}
.daftar-lagu-item:hover, .daftar-lagu-item.aktif{
    background: rgba(255,0,200,0.18);
    border-left-color: var(--neon2);
    text-shadow: 0 0 5px var(--neon2);
}

.pengaturan-blok{
    margin-top: 20px;
    padding: 14px;
    border-radius: 14px;
    background: rgba(255,255,255,0.05);
}
.judul-pengaturan{
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
}
.slider-booster{
    width: 100%;
    height: 6px;
    border-radius: 99px;
    background: rgba(255,255,255,0.15);
    outline: none;
    -webkit-appearance: none;
    margin: 8px 0;
}
.slider-booster::-webkit-slider-thumb{
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--neon1), var(--neon2));
    box-shadow: 0 0 10px var(--neon1);
    cursor: pointer;
}
.nilai-booster{
    text-align: right;
    font-size: 13px;
    opacity: 0.9;
}

.pilih-folder{
    display: block;
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 12px;
    border: 1.5px dashed var(--neon2);
    background: rgba(0,0,0,0.25);
    text-align: center;
    cursor: pointer;
    font-weight: 500;
}
.pilih-folder:active{
    background: linear-gradient(135deg, var(--neon1), var(--neon2));
    color: #000;
    border-style: solid;
}

.pilihan-tema{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
}
.kartu-tema{
    padding: 10px;
    border-radius: 12px;
    border: 1.5px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 13px;
}
.kartu-tema.aktif{
    border-color: var(--neon2);
    box-shadow: 0 0 12px var(--neon1);
    background: rgba(255,0,200,0.15);
}
.bulet-tema{
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--neon1), var(--neon2));
    box-shadow: 0 0 8px var(--neon1);
}
</style>
</head>
<body class="tema-pelangi">

<!-- HEADER -->
<div class="header">
    <div class="judul-aplikasi">
        <span class="icon">🎵</span>
        WINORO MUSIC
    </div>
    <div style="display: flex; gap: 10px;">
        <div class="tombol-tema" id="bukaTema">🎨</div>
        <div class="tombol-menu" id="bukaMenu">☰</div>
    </div>
</div>

<!-- LATAR PENUTUP LACI -->
<div class="tutup-latar" id="tutupLatar"></div>

<!-- LACI UTAMA (☰) -->
<div class="laci" id="laciUtama">
    <!-- ✅ TOMBOL TUTUP SILANG -->
    <div class="tombol-tutup" id="tutupMenu">✕</div>
    <h3>📋 DAFTAR & PENGATURAN</h3>
    <div class="garis-pemisah"></div>

    <label class="pilih-folder">📁 PILIH FOLDER LAGU
        <input type="file" id="inputFolder" webkitdirectory multiple hidden accept="audio/*">
    </label>

    <h4 style="margin: 15px 0 8px; opacity: 0.7;">🎵 DAFTAR LAGU</h4>
    <div id="daftarLaguDiMenu"></div>

    <div class="pengaturan-blok">
        <div class="judul-pengaturan">🔊 SOUND BOOSTER</div>
        <input type="range" min="1" max="150" value="100" class="slider-booster" id="boosterSuara">
        <div class="nilai-booster">Penguatan: <span id="nilaiBooster">100%</span></div>
        <div style="font-size: 11px; opacity: 0.6; margin-top: 4px;">Bisa sampai 150% lebih keras dari normal</div>
    </div>
</div>

<!-- LACI TEMA -->
<div class="laci" id="laciTema">
    <!-- ✅ TOMBOL TUTUP SILANG -->
    <div class="tombol-tutup" id="tutupTema">✕</div>
    <h3>🎨 GANTI TEMA & LATAR</h3>
    <div class="garis-pemisah"></div>
    <div class="pilihan-tema" id="daftarTema"></div>
</div>

<!-- ISI UTAMA -->
<div class="isi-tengah">
    <div class="pemutar">
        <!-- GAMBAR LAGU BISA DIKLIK -->
        <div class="wadah-gambar" id="wadahGambar">
            <img src="" alt="Gambar Lagu" class="gambar-lagu" id="gambarLagu">
            <input type="file" id="inputGambar" accept="image/*">
        </div>

        <div class="info-lagu">
            <div class="teks-sedang">SEDANG DIPUTAR</div>
            <div id="judul-lagu">— Belum ada lagu —</div>
        </div>

        <canvas id="visualGelombang"></canvas>

        <div class="batas-waktu" id="garisWaktu">
            <div class="isi-waktu" id="isiWaktu"></div>
        </div>
        <div class="waktu-tampil">
            <span id="waktuMulai">00:00</span>
            <span id="waktuSelesai">00:00</span>
        </div>

        <div class="tombol-kontrol">
            <button id="tombolAcak" title="Acak">🔀</button>
            <button id="tombolMundur">⏮</button>
            <button id="tombolMain" class="utama">▶</button>
            <button id="tombolMaju">⏭</button>
            <button id="tombolUlang" title="Ulang">🔁</button>
        </div>

        <div class="baris-volume">
            <span id="tombolBisukan" title="Klik untuk bisukan/nyalakan">🔊</span>
            <input type="range" id="garisVolume" min="0" max="1" step="0.01" value="0.7">
        </div>
    </div>
</div>

<script>
/* =========================================================
   🎨 DAFTAR TEMA
   ========================================================= */
const DAFTAR_TEMA = [
    { id:'tema-pelangi', nama:'Pelangi', warna:['#ff00c8','#00fff2'] },
    { id:'tema-ungu', nama:'Ungu', warna:['#c300ff','#7a00ff'] },
    { id:'tema-biru', nama:'Biru', warna:['#00e5ff','#0080ff'] },
    { id:'tema-merah', nama:'Merah', warna:['#ff0055','#ff8800'] },
    { id:'tema-hijau', nama:'Hijau', warna:['#00ff88','#88ff00'] },
    { id:'tema-emas', nama:'Emas', warna:['#ffd700','#ff8c00'] }
];

/* =========================================================
   📱 ELEMEN UTAMA
   ========================================================= */
const $ = id => document.getElementById(id);
const audio = new Audio();
let daftarLagu = [], indeksSekarang = 0, acakAktif = false, ulangAktif = false;
let gambarDefault = true;
let penguatSuara = 1.0; // 100%

/* =========================================================
   🎛️ KONTROL LACI DAN TOMBOL TUTUP
   ========================================================= */
const tutupLatar = $('tutupLatar');
const laciUtama = $('laciUtama');
const laciTema = $('laciTema');
const tutupMenu = $('tutupMenu');
const tutupTema = $('tutupTema');

function bukaLaci(laci){
    laci.classList.add('buka');
    tutupLatar.classList.add('buka');
}
function tutupSemuaLaci(){
    laciUtama.classList.remove('buka');
    laciTema.classList.remove('buka');
    tutupLatar.classList.remove('buka');
}

$('bukaMenu').onclick = () => bukaLaci(laciUtama);
$('bukaTema').onclick = () => bukaLaci(laciTema);
tutupMenu.onclick = tutupSemuaLaci;
tutupTema.onclick = tutupSemuaLaci;
tutupLatar.onclick = tutupSemuaLaci;

/* =========================================================
   🖼️ GAMBAR LAGU BISA DIGANTI MEMBER
   ========================================================= */
const wadahGambar = $('wadahGambar');
const gambarLagu = $('gambarLagu');
const inputGambar = $('inputGambar');

wadahGambar.onclick = () => inputGambar.click();
inputGambar.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    gambarLagu.src = URL.createObjectURL(file);
    gambarDefault = false;
    localStorage.setItem('gambarLaguPemutar', gambarLagu.src);
};

// Pulihkan gambar terakhir
if(localStorage.getItem('gambarLaguPemutar')){
    gambarLagu.src = localStorage.getItem('gambarLaguPemutar');
    gambarDefault = false;
}else{
    gambarLagu.textContent = '🎵';
}

/* =========================================================
   🔊 VOLUME & SOUND BOOSTER
   ========================================================= */
const tombolBisukan = $('tombolBisukan');
const garisVolume = $('garisVolume');
const sliderBooster = $('boosterSuara');
const nilaiBooster = $('nilaiBooster');
let statusBisukan = false;

// Bisukan / Nyalakan
tombolBisukan.onclick = () => {
    statusBisukan = !statusBisukan;
    audio.muted = statusBisukan;
    tombolBisukan.textContent = statusBisukan ? '🔇' : '🔊';
    tombolBisukan.style.color = statusBisukan ? '#ff5555' : 'var(--neon2)';
};

// Ikuti volume HP + kontrol manual
garisVolume.oninput = () => {
    audio.volume = garisVolume.value;
    statusBisukan = false;
    tombolBisukan.textContent = '🔊';
    tombolBisukan.style.color = 'var(--neon2)';
};

// Sound Booster sampai 150%
sliderBooster.oninput = () => {
    const nilai = sliderBooster.value;
    penguatSuara = nilai / 100;
    nilaiBooster.textContent = nilai + '%';
    if(audio.sourceNode && audio.gainNode) audio.gainNode.gain.value = penguatSuara;
    localStorage.setItem('penguatSuara', nilai);
};

// Pulihkan pengaturan terakhir
if(localStorage.getItem('penguatSuara')){
    const nilai = localStorage.getItem('penguatSuara');
    sliderBooster.value = nilai;
    penguatSuara = nilai / 100;
    nilaiBooster.textContent = nilai + '%';
}

/* =========================================================
   🎵 FUNGSI PEMUTAR LAGU
   ========================================================= */
const inputFolder = $('inputFolder');
const daftarMenu = $('daftarLaguDiMenu');
const judulLagu = $('judul-lagu');
const garisWaktu = $('garisWaktu');
const isiWaktu = $('isiWaktu');
const waktuMulai = $('waktuMulai');
const waktuSelesai = $('waktuSelesai');
const tombolMain = $('tombolMain');
const tombolMaju = $('tombolMaju');
const tombolMundur = $('tombolMundur');
const tombolAcak = $('tombolAcak');
const tombolUlang = $('tombolUlang');

inputFolder.onchange = e => {
    const file = [...e.target.files].filter(f => f.type.startsWith('audio/'));
    if(!file.length) return alert('❌ Tidak ada file lagu di folder ini');
    daftarLagu = file;
    indeksSekarang = 0;
    tampilkanDaftarLagu();
    muatLagu(0);
};

function tampilkanDaftarLagu(){
    daftarMenu.innerHTML = '';
    daftarLagu.forEach((lagu, i) => {
        const elemen = document.createElement('div');
        elemen.className = 'daftar-lagu-item' + (i === indeksSekarang ? ' aktif' : '');
        elemen.textContent = `${i+1}. ${lagu.name.replace(/\.[^/.]+$/, '')}`;
        elemen.onclick = () => {
            indeksSekarang = i;
            muatLagu(i);
            audio.play();
            tutupSemuaLaci();
        };
        daftarMenu.appendChild(elemen);
    });
}

function muatLagu(i){
    if(!daftarLagu[i]) return;
    audio.src = URL.createObjectURL(daftarLagu[i]);
    judulLagu.textContent = daftarLagu[i].name.replace(/\.[^/.]+$/, '');
    if(gambarDefault){
        gambarLagu.textContent = '🎵';
        gambarLagu.src = '';
    }
    tampilkanDaftarLagu();
}

function putarLagu(){
    if(audio.paused){
        audio.play();
        tombolMain.textContent = '⏸';
        gambarLagu.classList.add('putar');
    }else{
        audio.pause();
        tombolMain.textContent = '▶';
        gambarLagu.classList.remove('putar');
    }
}

tombolMain.onclick = () => daftarLagu.length ? putarLagu() : alert('Pilih folder lagu terlebih dahulu!');
tombolMaju.onclick = () => gantiLagu(1);
tombolMundur.onclick = () => gantiLagu(-1);
tombolAcak.onclick = () => { acakAktif = !acakAktif; tombolAcak.style.opacity = acakAktif ? 1 : 0.4; };
tombolUlang.onclick = () => { ulangAktif = !ulangAktif; tombolUlang.style.opacity = ulangAktif ? 1 : 0.4; };

function gantiLagu(arah){
    if(!daftarLagu.length) return;
    indeksSekarang = acakAktif ? Math.floor(Math.random() * daftarLagu.length) : (indeksSekarang + arah + daftarLagu.length) % daftarLagu.length;
    muatLagu(indeksSekarang);
    audio.play();
    tombolMain.textContent = '⏸';
    gambarLagu.classList.add('putar');
}

audio.ontimeupdate = () => {
    if(!audio.duration) return;
    const persen = (audio.currentTime / audio.duration) * 100;
    isiWaktu.style.width = persen + '%';
    waktuMulai.textContent = formatWaktu(audio.currentTime);
    waktuSelesai.textContent = formatWaktu(audio.duration);
};

audio.onended = () => ulangAktif ? audio.currentTime = 0 : gantiLagu(1);

garisWaktu.onclick = e => {
    const lebar = garisWaktu.getBoundingClientRect().width;
    const posisi = (e.offsetX / lebar) * audio.duration;
    audio.currentTime = posisi;
};

function formatWaktu(detik){
    const m = Math.floor(detik / 60);
    const d = Math.floor(detik % 60);
    return `${m}:${d < 10 ? '0' + d : d}`;
}

/* =========================================================
   🎨 TAMPILKAN PILIHAN TEMA
   ========================================================= */
function tampilkanTema(){
    const daftarTema = $('daftarTema');
    daftarTema.innerHTML = '';
    const temaAktif = document.body.className;
    DAFTAR_TEMA.forEach(tema => {
        const kartu = document.createElement('div');
        kartu.className = 'kartu-tema' + (temaAktif === tema.id ? ' aktif' : '');
        kartu.innerHTML = `<div class="bulet-tema" style="background: linear-gradient(135deg, ${tema.warna[0]}, ${tema.warna[1]})"></div><span>${tema.nama}</span>`;
        kartu.onclick = () => {
            document.body.className = tema.id;
            tampilkanTema();
            tutupSemuaLaci();
            localStorage.setItem('temaTerpilih', tema.id);
        };
        daftarTema.appendChild(kartu);
    });
}

// Pulihkan tema terakhir
if(localStorage.getItem('temaTerpilih')) document.body.className = localStorage.getItem('temaTerpilih');
tampilkanTema();

/* =========================================================
   📊 VISUAL GELOMBANG SUARA
   ========================================================= */
const kanvas = $('visualGelombang');
const konteks = kanvas.getContext('2d');
let analisa, sumber;

audio.onplay = () => {
    if(analisa) return;
    const konteksAudio = new (window.AudioContext || window.webkitAudioContext)();
    sumber = konteksAudio.createMediaElementSource(audio);
    analisa = konteksAudio.createAnalyser();
    const penguat = konteksAudio.createGain();
    penguat.gain.value = penguatSuara;
    audio.gainNode = penguat;
    audio.sourceNode = sumber;
    analisa.fftSize = 128;
    sumber.connect(penguat);
    penguat.connect(analisa);
    analisa.connect(konteksAudio.destination);
    gambarGelombang();
};

function gambarGelombang(){
    requestAnimationFrame(gambarGelombang);
    if(!analisa) return;
    const data = new Uint8Array(analisa.frequencyBinCount);
    analisa.getByteFrequencyData(data);
    const lebar = kanvas.width = kanvas.offsetWidth * 2;
    const tinggi = kanvas.height = 140;
    konteks.clearRect(0, 0, lebar, tinggi);
    const lebarBatang = lebar / data.length;
    for(let i = 0; i < data.length; i++){
        const tinggiBatang = (data[i] / 255) * tinggi;
        const gradasi = konteks.createLinearGradient(0, tinggi - tinggiBatang, 0, tinggi);
        gradasi.addColorStop(0, getComputedStyle(document.body).getPropertyValue('--neon1'));
        gradasi.addColorStop(1, getComputedStyle(document.body).getPropertyValue('--neon2'));
        konteks.fillStyle = gradasi;
        konteks.shadowBlur = 10;
        konteks.shadowColor = getComputedStyle(document.body).getPropertyValue('--neon1');
        konteks.fillRect(i * lebarBatang + 2, tinggi - tinggiBatang, lebarBatang - 4, tinggiBatang);
    }
}
</script>
